spring:
  application:
    name: online-courses

  profiles:
    active: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/online-courses
    username: harbygarcia8
    password: admin

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: billing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*" # Permite deserializar clases de cualquier paquete
        spring.json.type.mapping: "com.onlinecourses.enrollment.application.command.CreateEnrollmentKafkaEvent:com.onlinecourses.billing.application.command.CreatePaymentOrderCommand"

server:
  port: 8080